Summary: 飲食店の来店スタンプ (登録なしで使える)
Description: |-
  飲食店の来店スタンプカードのアプリです。お店の QR を読むとスタンプが貯まり、
  決まった数になると特典が付きます。特典はお店の人に画面を見せて使います。

  登録は要りません。端末ごとに匿名の ID を作って使い、ニックネームは任意です。
  機種を変えるときは、引き継ぎコードを新しい端末で読めば記録を移せます。

  店頭に置かれた QR では、お店の近くにいるかを位置情報で確かめます。
  お店の画面に出る QR や、お店の人に自分の QR を読んでもらう方法でも貯められます。
  電波の悪いお店では記録しておき、繋がったときに送ります。

  お店の側は、別のアプリ「スタンプ管理」を使います。
