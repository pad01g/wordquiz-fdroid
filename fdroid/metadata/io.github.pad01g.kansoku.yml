Name: 観測
Summary: 行動分析と A/B テストを、手を動かして確かめるための実験場
Description: |-
  **このアプリは、利用のされ方を数えるための実験場です。**
  中身は 1 日 1 問の 3 択診断ですが、それは題材で、目的は
  「行動分析と A/B テストが中で何をしているか」を確かめることです。

  何をしているか:

  * 同じ出来事を 2 か所に送ります。1 つは Google Analytics、
    もう 1 つは作者が自分で建てたサーバです
  * 片方で出した結論を、もう片方で同じ数字として再現できるかを確かめます
  * 画面の出し分け (A/B テスト) をして、行動が変わるかを測ります

  **数えていることを隠しません:**

  アプリの中に「観測室」という画面があり、そこで

  * 自分がどの仮名で数えられているか
  * いまどの群に入っていて、それを誰が決めたか
  * 送り先が生きているか、何件待っているか、何件捨てたか

  が全部見られます。送っていないものはそこに出ません。

  送らないもの:

  * 選んだ答えそのもの、結果の文面
  * 名前、連絡先、位置、端末の識別子
  * 自由に入力した文字列 (そもそも入力欄がありません)

  仮名は初回起動時に端末の中で作った乱数で、他のどこにも紐づきません。
  端末を変えれば別人になります。

  広告について:

  広告枠が出ることがありますが、**本物の広告配信はしていません**。
  出るのは Google が公開しているテスト広告か、枠を模しただけの箱です。
  収益は発生しません。枠があると行動が変わるかを測るために置いてあります。

  Google Play 開発者サービスが入っていない端末でも動きます。
  その場合は Google 側への送信と広告が行われず、作者のサーバへの
  記録だけが続きます。群の割り当ても端末の中で行われます。

# 目的そのものが追跡なので、いちばん強く申告しておく。
AntiFeatures:
  Tracking: |-
    **このアプリの目的は、利用のされ方を数えることです。**

    どの画面を開いたか、どのボタンを押したか、どこでやめたかを、
    Google Analytics (Firebase) と、作者が運用するサーバの両方へ送ります。
    仮名の利用者 id を付けるので、**同じ端末での行動は繋がった形で
    記録されます**。

    何を送っているかは、アプリの中の「観測室」で全部見られます。
    送っていないものはそこに出ません。

  NonFreeNet: |-
    ソース非公開のサーバに繋がります。Google (Firebase / Google Analytics /
    AdMob) と、作者が運用する記録用のサーバです。

  NonFreeDep: |-
    Firebase (Analytics / Remote Config) と AdMob の SDK を含みます。
    これはソース非公開の依存で、端末の Google Play 開発者サービスを
    通して動きます。

    **Google Play が入っていない端末でも、インストールと利用はできます。**
    その場合は Google 側への送信と広告が行われません。それ以外は同じように動きます。
