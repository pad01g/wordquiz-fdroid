Name: P2P Chess
Summary: 端末どうしが直接つながって指すチェス
Description: |-
  部屋コードを相手に伝えるだけで対局できるチェスです。
  対局中の指し手は、できるかぎり端末どうしが直接やり取りします
  (WebRTC の DataChannel)。

  直接つなげない回線では中継サーバを挟み、それも駄目なときは
  待ち合わせサーバが指し手を中継します。
  いまどの経路で繋がっているかは対局画面に表示されます。

  同じ端末での 2 人対戦、課題局面、定跡の閲覧はオフラインでも使えます。

  アカウント登録はありません。棋譜と設定は端末の中にだけ保存されます。

  注意: 端末どうしを直接つなぐ方式の性質上、対戦相手にあなたの
  IP アドレスが見えます。気になる場合は設定から
  「相手に IP アドレスを見せない」を有効にすると、
  常に中継サーバを経由するようになります。

# 対局相手との待ち合わせに、作者が管理するサーバ (ソース非公開) を使う。
# 利用者に対して正直に申告しておく。
AntiFeatures:
  NonFreeNet: |-
    対局相手との待ち合わせ (シグナリング) と NAT 越えの補助に、
    作者が運用するソース非公開のサーバを使います。
    対局そのもののデータは、可能なかぎり端末どうしで直接やり取りします。
    オフラインの機能 (同じ端末での 2 人対戦、課題局面、定跡) は
    サーバを使いません。

