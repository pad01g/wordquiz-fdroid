Name: Matching
Summary: 条件の合う相手を探して、マッチしたら話せる
Description: |-
  条件の合う相手を 1 人ずつ表示し、「いいね」か「パス」を選びます。
  お互いが「いいね」したらマッチが成立し、メッセージのやり取りができます。

  できること:

  * ユーザー名とパスワードで登録・ログイン
  * 年齢と性別で相手を絞り込む
  * カードをめくる感覚で相手を見ていく
  * プロフィール写真を 6 枚まで登録 (端末で縮小してから送ります)
  * マッチした相手とのメッセージ

  このアプリについて:

  * **本人確認 (KYC) はありません。** 相手が名乗っているとおりの人物である
    保証はありません。
  * **登録した写真は作者のサーバに保存されます。** 写真を 1 枚も
    登録していない場合は、利用者 ID から生成した図形が代わりに出ます。
  * **作者が個人で運用しているサーバが停止していると使えません。**
    アカウントもメッセージもそのサーバにしかないためです。
  * **広告はありません。** ただしどの画面が開かれたかを Google へ送ります。
    プロフィールもメッセージもそちらへは送りません
    (下の「利用者追跡」を見てください)。

# アカウントもメッセージも、作者が運用するソース非公開のサーバにしかない。
# チェスと違って縮退して動くこともできないので、その点を強く書いておく。
AntiFeatures:
  NonFreeNet: |-
    このアプリは、作者が運用するソース非公開のサーバが無いと
    **一切動きません**。アカウント・プロフィール・写真・マッチ・
    メッセージはすべてそのサーバに保存され、端末の中だけで完結する
    機能はありません。

    サーバが停止していればログインもできません。
    また、そのサーバのソースコードは公開されていないため、
    あなたのデータがどう扱われるかを利用者が検証することはできません。

  Tracking: |-
    どの画面が開かれたかを Google Analytics (Firebase) へ送ります。
    送るのは**画面の名前と操作の名前だけ**です。
    プロフィールも、相手が誰かも、メッセージの中身も送りません。

    通知を受け取るために Firebase Cloud Messaging も使います。
    通知の許可を出さなければ、宛先そのものを作りません。

    広告 ID を使う権限は、マニフェストで明示的に取り消してあります。

  NonFreeDep: |-
    Firebase (Google Analytics / Cloud Messaging) の SDK を含みます。
    これはソース非公開の依存で、端末の Google Play 開発者サービスを通して動きます。

    **Google Play が入っていない端末でも、インストールと利用はできます。**
    その場合は通知が届かず、利用状況も送られません。それ以外は同じように動きます。
