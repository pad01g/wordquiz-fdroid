Name: Matching Example
Summary: 動作確認用のサンプル。実際のサービスではありません
Description: |-
  これは **動作確認用のサンプルアプリ** です。
  実際のマッチングサービスとして使うために作られたものではありません。

  自宅に置いたサーバを複数のアプリから使い回せること、そのサーバを介して
  利用者どうしがやり取りできることを確かめるために置いています。

  できること:

  * ユーザー名とパスワードで登録・ログイン
  * 条件に合う相手を 1 人ずつ表示して「いいね」か「パス」を選ぶ
  * お互いが「いいね」したらマッチが成立し、メッセージをやり取りできる

  重要な注意:

  * **本人確認 (KYC) は実装していません。** 動作確認の邪魔になるためです。
    相手が名乗っているとおりの人物である保証は一切ありません。
  * **写真は扱いません。** プロフィールのアイコンは利用者 ID から
    生成した図形で、画像はどこにも保存されません。
  * **作者のサーバが停止しているとアプリは一切使えません。**
    アカウントもメッセージもそのサーバにしかないためです。
  * 動作確認用の架空のプロフィールがあらかじめ入っています。

  実在の相手との出会いを目的に使わないでください。

# アカウントもメッセージも、作者が運用するソース非公開のサーバにしかない。
# チェスと違って縮退して動くこともできないので、その点を強く書いておく。
AntiFeatures:
  NonFreeNet: |-
    このアプリは、作者が運用するソース非公開のサーバが無いと
    **一切動きません**。アカウント・プロフィール・マッチ・メッセージは
    すべてそのサーバに保存され、端末の中だけで完結する機能はありません。

    サーバが停止していればログインもできません。
    また、そのサーバのソースコードは公開されていないため、
    あなたのデータがどう扱われるかを利用者が検証することはできません。

    これは動作確認用のサンプルなので、実際の個人情報を入れないでください。

