Summary: 来店スタンプのお店用の管理アプリ
Description: |-
  飲食店が来店スタンプを配るための管理アプリです。お客さんは別のアプリ
  「来店スタンプ」を使います。

  お店の画面に、しばらくごとに変わる QR を出してお客さんに読んでもらうか、
  お客さんの QR を読み取ってスタンプを付けます。変わる QR は 1 回しか使えないので、
  写真で回されても 2 人目には付きません。印刷して店頭に置く QR も作れます。

  管理画面では、お客さん (登録していない匿名の人も含む) の来店の記録、特典の付与と使用、
  メモ、受付の停止、日別・時間帯別の集計、CSV への書き出し、お知らせの配信ができます。

  お店の鍵はこの端末の中にだけ置かれ、パスワードはありません。
  ほかの端末でも管理したいときは、引き継ぎコードを読ませます。
