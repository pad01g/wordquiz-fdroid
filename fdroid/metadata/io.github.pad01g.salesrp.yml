Name: セールスロープレ
Summary: 商談の場面で何と言うかを選ぶ、営業の練習
Description: |-
  商談の場面が出て、何と言うかを選びます。
  相手の心証や警戒心は見えないまま動き、最後に受注か失注かが決まります。

  できること:

  * 価格交渉・初回訪問・クレーム対応・社内稟議など、型の違う商談
  * 相手の返事は、それまでのやりとりの積み重ねによって変わる
  * 一手ごとに「なぜその手を選んだか」を書いてから先へ進む
  * 商談が終わったら、自分の選択と、そのとき考えていたことを見返せる
  * 答えを見たいときは、設定の解答閲覧で最善手と理由を開ける
  * 画面の文言は日本語と英語を切り替えられます

  選んだ理由を、返事を見る前に書きます:

  手を選ぶと、そこで確定して**選び直せなくなり**、相手の返事が出る前に
  「なぜそうしたか」を書く画面になります。書いている間は時計が止まります。

  返事を見てから書くと、上手くいった手には後から立派な理由が付き、
  外した手には言い訳が付きます。それは練習ではなく作文になるので、
  **知らないまま言葉にする**順番にしてあります。

  通信しなくても遊べます:

  このアプリは**インターネットに繋がっていなくても最後まで遊べます**。
  商談のデータはアプリの中に入っていて、判定も端末の中で終わります。
  電車の中でも、圏外でも、同じように動きます。

  登録は任意です:

  ユーザー名とパスワードを登録すると、機種変更のときに進み具合を
  引き継げます。登録しなくても、遊べる内容は何も変わりません。

  何人かで使うこともできます:

  組織を作って招待コードで人を迎えると、問題をまとめて配り、
  出した答えとその理由に講評を返せます。新人研修のような使い方を
  想定していますが、**一人で使うぶんには何も変わりません**。
  組織に入っていても、個人でやった練習は誰にも見せません。

  このアプリについて:

  * **なぜ失敗したのかは教えません。** 実際の商談でも理由は
    教えてもらえないので、会話を見返して考えるところまでを練習とします。
  * 相手は嘘をつくことがあります。聞いて得た答えを鵜呑みにすると外れます。
  * **広告はありません。** ただしどの画面が開かれたかを Google へ送ります。
    シナリオの名前も成績もそちらへは送りません
    (下の「利用者追跡」を見てください)。
  * 「しばらく練習していません」という通知を受け取れます。
    登録して、通知を許可したときだけです。

# 進み具合の引き継ぎにだけ作者のサーバを使う。使わなくても全機能が動くので、
# 他のアプリより弱い申告になる。利用者に対して正直に書いておく。
AntiFeatures:
  NonFreeNet: |-
    ユーザー名とパスワードを登録した場合にかぎり、進み具合の保管に
    作者が運用するソース非公開のサーバを使います。

    **登録しなければ通信は一切しません。** 商談のデータはアプリに
    同梱されていて、判定も端末の中で終わるため、サーバが止まっていても、
    そもそもインターネットに繋がっていなくても、すべての商談を
    最後まで遊べます。サーバが預かるのは「どの商談をどう終えたか」だけです。

    組織を作って何人かで使う場合は、配った問題・出した答え・講評も
    そのサーバに保存されます。組織に入っていても、**個人でやった練習は
    そこには入りません。**

    ただし、そのサーバのソースコードは公開されていないため、
    登録した場合にその記録がどう扱われるかを利用者が検証することはできません。

  Tracking: |-
    どの画面が開かれたかを Google Analytics (Firebase) へ送ります。
    送るのは**画面の名前と操作の名前だけ**です。
    シナリオの名前も、成績も、選んだ答えも送りません。

    通知を受け取るために Firebase Cloud Messaging も使います。
    通知の許可を出さなければ、宛先そのものを作りません。

    広告 ID を使う権限は、マニフェストで明示的に取り消してあります。

  NonFreeDep: |-
    Firebase (Google Analytics / Cloud Messaging) の SDK を含みます。
    これはソース非公開の依存で、端末の Google Play 開発者サービスを通して動きます。

    **Google Play が入っていない端末でも、インストールと利用はできます。**
    その場合は通知が届かず、利用状況も送られません。それ以外は同じように動きます。
